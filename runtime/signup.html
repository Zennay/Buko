<!doctype html><html lang="nl"><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><meta name=referrer content=no-referrer><title>Werkruimte openen · Blendbook</title>
<link rel="stylesheet" href="/ui.css"><header class="top"><a class="brand" href="/"><i class="mark">b</i>Blendbook</a><a href="/admin">Dashboard</a></header>
<main class="gate"><section class="panel"><h1 id="heading">Werkruimte maken</h1><form><label>Bedrijfscode<input name="shop" required pattern="[a-z0-9-]{1,48}" placeholder="studio-robin" autocomplete="username"></label><small>Gebruik kleine letters, cijfers en streepjes.</small><label id="passlabel">Wachtwoord<input name="password" type="password" required minlength="12" maxlength="160" autocomplete="new-password"></label><label hidden id="emaillabel">Zakelijk e-mailadres<input name="email" type="email" disabled></label><button id="submit">Werkruimte maken</button></form><div id="switches"><p><button class="soft" id="mode">Ik heb al een wachtwoord</button></p><details><summary>Toegang via e-mail</summary><p>Voor werkruimtes die met een e-mailadres zijn aangemaakt.</p><button class="soft" id="emailMode">Gebruik e-mail</button></details></div>
<button id="claim" hidden>Open mijn beheeromgeving</button><output aria-live="polite"></output></section></main>
<script>
const form=document.querySelector('form'),claim=document.querySelector('#claim'),msg=document.querySelector('output');
const key=location.hash.slice(1);
let action=new URLSearchParams(location.search).has('login')?'login':'register';
function mode(a){action=a;const email=a==='start',login=a==='login';form.password.disabled=email;form.email.disabled=!email;form.email.required=email;document.querySelector('#passlabel').hidden=email;document.querySelector('#emaillabel').hidden=!email;form.password.autocomplete=login?'current-password':'new-password';document.querySelector('#heading').textContent=document.querySelector('#submit').textContent=email?'Toegangslink aanvragen':login?'Inloggen':'Werkruimte maken';document.querySelector('#mode').textContent=login?'Nieuwe werkruimte maken':'Ik heb al een wachtwoord'}
mode(action);document.querySelector('#mode').onclick=()=>mode(action==='login'?'register':'login');document.querySelector('#emailMode').onclick=()=>mode('start');
if(key){document.querySelector('#switches').hidden=true;document.querySelector('#heading').textContent='Werkruimte openen';history.replaceState(null,'',location.pathname);form.hidden=true;claim.hidden=false;}
async function call(action,data){
 const res=await fetch('/api/account/'+action,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});
 const b=await res.json();if(!res.ok)throw Error(b.error);return b;
}
form.onsubmit=async e=>{e.preventDefault();try{const r=await call(action,Object.fromEntries(new FormData(form)));if(r.key){sessionStorage.setItem('blendbook-login',JSON.stringify(r));location.replace('/admin')}else msg.textContent=r.message}catch(e){msg.textContent=e.message}};
claim.onclick=async()=>{try{const b=await call('finish',{key});sessionStorage.setItem('blendbook-login',JSON.stringify(b));location.replace('/admin')}catch(e){msg.textContent=e.message}};
</script></html>
